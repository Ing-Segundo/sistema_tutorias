<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Sistema de Tutorías</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root{
            --verde-ut:#0E7C70;
            --verde-sec:#15803D;
            --verde-acento:#86D977;
            --verde-claro:#F0FDF4;
            --verde-suave:#E6F7F5;
            --texto:#1E293B;
            --texto-sec:#64748B;
            --borde:#D8F1ED;
            --shadow:0 12px 40px rgba(14,124,112,.12);
            --shadow-hover:0 18px 45px rgba(14,124,112,.18);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
            color: var(--texto);
        }

        body{
            min-height:100vh;
            background:
            radial-gradient(circle at top right,rgba(134,217,119,.20),transparent 28%),
            radial-gradient(circle at bottom left,rgba(14,124,112,.12),transparent 35%),
            linear-gradient(135deg,#F8FFFC,#EEFDF8,#E6F7F5);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:30px;
            overflow-y:auto;
        }

        .login-card{
            width:100%;
            max-width:470px;
            background:white;
            border-radius:28px;
            padding:42px;
            box-shadow:var(--shadow);
            border:1px solid var(--borde);
            position:relative;
            z-index:10;
            margin:20px 0;
            transition: box-shadow 0.3s ease;
        }

        .login-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .logo{
            width:88px;
            height:88px;
            margin:0 auto 20px;
            border-radius:50%;
            background:linear-gradient(135deg,var(--verde-ut),var(--verde-sec));
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow: 0 8px 20px rgba(14, 124, 112, 0.2);
        }

        .logo i{
            font-size:42px;
            color:white;
        }

        h1{
            text-align:center;
            font-size:31px;
            font-weight:800;
            color:var(--verde-ut);
            letter-spacing: -0.02em;
        }

        .subtitulo{
            text-align:center;
            color:var(--texto-sec);
            margin:8px 0 25px;
            font-size: 15px;
        }

        .alert-custom{
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-error{
            background-color: #FEF2F2;
            border: 1px solid #FCA5A5;
            color: #991B1B;
        }

        .alert-error i, .alert-error span {
            color: #991B1B;
        }

        .alert-success{
            background-color: #F0FDF4;
            border: 1px solid #86EFAC;
            color: #166534;
        }

        .alert-success i, .alert-success span {
            color: #166534;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            font-size: 14px;
            color: var(--texto);
        }

        .input-custom{
            width:100%;
            display:flex;
            align-items:center;
            background:#F8FFFD;
            border:2px solid #E6F7F5;
            border-radius:16px;
            padding:12px 16px;
            transition: all 0.2s ease;
        }

        .input-custom:focus-within {
            border-color: var(--verde-ut);
            background: white;
            box-shadow: 0 0 0 4px rgba(14, 124, 112, 0.1);
        }

        .input-custom i{
            color:var(--verde-ut);
            margin-right:12px;
            font-size: 18px;
        }

        .input-custom input{
            width:100%;
            border:none;
            outline:none;
            background:none;
            font-size: 15px;
            color: var(--texto);
        }

        .input-custom input::placeholder {
            color: #94A3B8;
        }

        .btn-login{
            width:100%;
            margin-top:12px;
            padding:14px;
            border:none;
            border-radius:16px;
            background:linear-gradient(135deg,var(--verde-ut),var(--verde-sec));
            color:white;
            font-size:16px;
            font-weight:700;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            transition: all 0.25s ease;
        }

        .btn-login i {
            color: white;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(14, 124, 112, 0.3);
            opacity: 0.95;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .footer-login{
            margin-top:28px;
            text-align:center;
            font-size:13px;
            color:var(--texto-sec);
        }

        .footer-login span{
            display:block;
            margin-top:4px;
            color:var(--verde-ut);
            font-weight:600;
        }

        @media(max-width:600px){
            body{
                padding:15px;
                align-items:flex-start;
            }

            .login-card{
                padding:30px 22px;
                border-radius:22px;
                margin:20px 0;
            }

            h1{
                font-size:25px;
            }

            .logo{
                width:75px;
                height:75px;
            }

            .logo i{
                font-size:34px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        <i class="bi bi-mortarboard-fill"></i>
    </div>

    <h1>Sistema de Tutorías</h1>

    <p class="subtitulo">
        Universidad Tecnológica de Nayarit
    </p>

    <!-- MENSAJE DE ERROR / FLASH -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert-custom {% if category == 'error' %}alert-error{% else %}alert-success{% endif %}">
            <i class="bi {% if category == 'error' %}bi-exclamation-triangle-fill{% else %}bi-check-circle-fill{% endif %}"></i>
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}" autocomplete="off">

        <div class="input-group">
            <label for="credencial">Credencial</label>
            <div class="input-custom">
                <i class="bi bi-person-fill"></i>
                <input type="text" id="credencial" name="credencial" required placeholder="Escribe tu credencial">
            </div>
        </div>

        <div class="input-group">
            <label for="contrasena">Contraseña</label>
            <div class="input-custom">
                <i class="bi bi-lock-fill"></i>
                <input type="password" id="contrasena" name="contrasena" required placeholder="Escribe tu contraseña">
            </div>
        </div>

        <button class="btn-login" type="submit">
            <i class="bi bi-box-arrow-in-right"></i>
            Iniciar Sesión
        </button>

    </form>

    <div class="footer-login">
        Sistema Integral de Tutorías
        <span>
            Universidad Tecnológica de Nayarit
        </span>
    </div>

</div>

</body>
</html>
