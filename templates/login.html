<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio de Sesión | Sistema de Tutorías</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
:root{
    --verde-ut:#0E7C70;
    --verde-sec:#15803D;
    --verde-acento:#86D977;
    --verde-claro:#F0FDF4;
    --verde-suave:#E6F7F5;
    --texto:#1E293B;
    --texto-sec:#64748B;
    --borde:#D8F1ED;
    --shadow:0 12px 40px rgba(14,124,112,.12);
    --shadow-hover:0 18px 45px rgba(14,124,112,.18);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top right,rgba(134,217,119,.20),transparent 28%),
    radial-gradient(circle at bottom left,rgba(14,124,112,.12),transparent 35%),
    linear-gradient(135deg,#F8FFFC,#EEFDF8,#E6F7F5);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    overflow-y:auto;
}

.login-card{
    width:100%;
    max-width:470px;
    background:white;
    border-radius:28px;
    padding:42px;
    box-shadow:var(--shadow);
    border:1px solid var(--borde);
    position:relative;
    z-index:10;
    margin:20px 0;
}

.logo{
    width:88px;
    height:88px;
    margin:0 auto 20px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--verde-ut),var(--verde-sec));
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo i{
    font-size:42px;
    color:white;
}

h1{
    text-align:center;
    font-size:31px;
    font-weight:800;
    color:var(--verde-ut);
}

.subtitulo{
    text-align:center;
    color:var(--texto-sec);
    margin:10px 0 35px;
}

.input-group{
    margin-bottom:22px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.input-custom{
    width:100%;
    display:flex;
    align-items:center;
    background:#F8FFFD;
    border:2px solid #E6F7F5;
    border-radius:16px;
    padding:14px 18px;
}

.input-custom i{
    color:var(--verde-ut);
    margin-right:12px;
}

.input-custom input{
    width:100%;
    border:none;
    outline:none;
    background:none;
}

.btn-login{
    width:100%;
    margin-top:8px;
    padding:15px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,var(--verde-ut),var(--verde-sec));
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.footer-login{
    margin-top:28px;
    text-align:center;
    font-size:13px;
    color:#64748B;
}

.footer-login span{
    display:block;
    margin-top:6px;
    color:var(--verde-ut);
    font-weight:600;
}

@media(max-width:600px){
    body{
        padding:15px;
        align-items:flex-start;
    }

    .login-card{
        padding:30px 22px;
        border-radius:22px;
        margin:20px 0;
    }

    h1{
        font-size:25px;
    }

    .logo{
        width:75px;
        height:75px;
    }

    .logo i{
        font-size:34px;
    }
}
</style>
</head>

<body class="bg-light d-flex align-items-center vh-100">

    <div class="container" style="max-width: 400px;">
        <div class="card shadow p-4">
            <h3 class="text-center mb-3">Sistema de Tutorías</h3>

            <!-- ================= MOSTRAR MENSAJES FLASH ================= -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{% if category == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            <!-- ========================================================= -->

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="credencial" class="form-label">Usuario / Credencial:</label>
                    <input type="text" id="credencial" name="credencial" class="form-control" required placeholder="Ej. coordinador, TUT-000001">
                </div>

                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" class="form-control" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- Script de Bootstrap para cerrar la alerta si usas el botón 'X' -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
