<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de Sesión · Sistema de Tutorías</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS + DaisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
    
    <!-- Font Awesome 6 Pro/Free -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        :root {
            --verde-ut: #0E7C70;
            --verde-ut-dark: #0B6359;
            --verde-sec: #15803D;
            --verde-suave: #E6F7F5;
            --verde-claro: #F0FDF4;
            --texto-principal: #0F172A;
            --texto-secundario: #475569;
            --texto-muted: #94A3B8;
            --borde-suave: #E2E8F0;
            --sombra-card: 0 20px 40px -15px rgba(14, 124, 112, 0.07), 0 0 15px 0 rgba(0, 0, 0, 0.03);
            --sombra-card-hover: 0 25px 50px -12px rgba(14, 124, 112, 0.15);
            --radius-main: 1.25rem;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #F8FAFC;
            background-image: 
                radial-gradient(at 0% 0%, rgba(134, 217, 119, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 124, 112, 0.08) 0px, transparent 50%);
            color: var(--texto-principal);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Card Container UI */
        .login-card {
            background: #FFFFFF;
            border-radius: var(--radius-main);
            border: 1px solid var(--borde-suave);
            box-shadow: var(--sombra-card);
            transition: box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card:hover {
            box-shadow: var(--sombra-card-hover);
        }

        /* Avatar Brand Badge */
        .brand-logo-container {
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 1.25rem;
            background: linear-gradient(135deg, var(--verde-ut), var(--verde-sec));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(14, 124, 112, 0.3);
            margin: 0 auto 1.5rem auto;
        }

        /* Focus & Form State Accessibility Tokens */
        .input-group-custom {
            position: relative;
            display: flex;
            align-items: center;
            background-color: #F8FAFC;
            border: 1.5px solid var(--borde-suave);
            border-radius: 0.875rem;
            transition: all 0.2s ease;
        }

        .input-group-custom:focus-within {
            border-color: var(--verde-ut);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(14, 124, 112, 0.12);
        }

        .input-group-custom input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            font-size: 0.9375rem;
            color: var(--texto-principal);
            font-weight: 500;
        }

        .input-group-custom input::placeholder {
            color: var(--texto-muted);
        }

        .input-icon-left {
            position: absolute;
            left: 1rem;
            color: var(--verde-ut);
            font-size: 1.125rem;
            pointer-events: none;
        }

        .input-toggle-btn {
            position: absolute;
            right: 0.875rem;
            background: transparent;
            border: none;
            color: var(--texto-secundario);
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1rem;
            transition: color 0.15s ease;
        }

        .input-toggle-btn:hover {
            color: var(--verde-ut);
        }

        /* Primary Button Tokens */
        .btn-submit-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--verde-ut), var(--verde-ut-dark));
            color: #FFFFFF;
            font-weight: 600;
            font-size: 0.9375rem;
            padding: 0.875rem 1.5rem;
            border-radius: 0.875rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px 0 rgba(14, 124, 112, 0.25);
        }

        .btn-submit-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 rgba(14, 124, 112, 0.35);
            background: linear-gradient(135deg, #0f887b, var(--verde-ut));
        }

        .btn-submit-primary:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px 0 rgba(14, 124, 112, 0.2);
        }

        .btn-submit-primary:focus-visible {
            outline: 2px solid var(--verde-ut);
            outline-offset: 2px;
        }

        /* Custom Alert Enterprise */
        .alert-enterprise {
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .alert-enterprise-error {
            background-color: #FEF2F2;
            border: 1px solid #FEE2E2;
            color: #991B1B;
        }

        .alert-enterprise-success {
            background-color: #F0FDF4;
            border: 1px solid #DCFCE7;
            color: #166534;
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <main class="w-full max-w-[440px] mx-auto">
        
        <!-- LOGIN CARD -->
        <div class="login-card p-6 sm:p-10">
            
            <!-- BRAND HEADER -->
            <div class="text-center">
                <div class="brand-logo-container">
                    <i class="fas fa-graduation-cap text-3xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">
                    Sistema de Tutorías
                </h1>
                <p class="text-sm font-medium text-slate-500 mt-1 mb-8">
                    Universidad Tecnológica de Nayarit
                </p>
            </div>

            <!-- MENSAJE DE ERROR / FLASH -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert-enterprise {% if category == 'error' %}alert-enterprise-error{% else %}alert-enterprise-success{% endif %}" role="alert" aria-live="polite">
                    <i class="fas {% if category == 'error' %}fa-exclamation-circle text-red-600{% else %}fa-check-circle text-emerald-600{% endif %} text-base flex-shrink-0"></i>
                    <span class="leading-tight">{{ message }}</span>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- FORMULARIO DE ACCESO -->
            <form method="POST" action="{{ url_for('login') }}" autocomplete="on" class="space-y-5">
                
                <!-- CAMPO CREDENCIAL -->
                <div>
                    <label for="credencial" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                        Credencial / Usuario
                    </label>
                    <div class="input-group-custom">
                        <i class="fas fa-id-card input-icon-left"></i>
                        <input 
                            type="text" 
                            id="credencial" 
                            name="credencial" 
                            required 
                            placeholder="Ej. 20241010"
                            autocomplete="username"
                        />
                    </div>
                </div>

                <!-- CAMPO CONTRASEÑA -->
                <div>
                    <label for="contrasena" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                        Contraseña
                    </label>
                    <div class="input-group-custom">
                        <i class="fas fa-lock input-icon-left"></i>
                        <input 
                            type="password" 
                            id="contrasena" 
                            name="contrasena" 
                            required 
                            placeholder="••••••••••••"
                            autocomplete="current-password"
                        />
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="input-toggle-btn" 
                            aria-label="Mostrar u ocultar contraseña"
                            tabindex="-1"
                        >
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- BOTÓN SUBMIT -->
                <div class="pt-2">
                    <button class="btn-submit-primary" type="submit">
                        <i class="fas fa-sign-in-alt text-sm"></i>
                        <span>Iniciar Sesión</span>
                    </button>
                </div>

            </form>

            <!-- FOOTER LEGAL -->
            <footer class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-400 font-medium">
                    Sistema Integral de Tutorías
                </p>
                <p class="text-xs font-semibold text-[#0E7C70] mt-0.5">
                    Universidad Tecnológica de Nayarit
                </p>
            </footer>

        </div>

    </main>

    <!-- JS PARA VISIBILIDAD DE CONTRASEÑA -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('contrasena');
            const toggleIcon = document.getElementById('toggleIcon');

            if (togglePasswordBtn && passwordInput && toggleIcon) {
                togglePasswordBtn.addEventListener('click', function() {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    
                    toggleIcon.classList.toggle('fa-eye', !isPassword);
                    toggleIcon.classList.toggle('fa-eye-slash', isPassword);
                });
            }
        });
    </script>

</body>
</html>
